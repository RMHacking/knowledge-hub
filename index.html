function viewStudies(){
  const st=store.studies.find(s=>s.id===store.activeStudy);
  if(st) return viewStudyDetail(st);

  // aba ativa
  let f=store.studyFilter;
  if(!STUDY_TYPES[f]) { f="lecture"; store.studyFilter=f; }
  const T=STUDY_TYPES[f];

  // valida a pasta atual (precisa existir e ser do tipo certo)
  let cur=store.currentFolder;
  const curFolder=store.studyFolders.find(x=>x.id===cur && x.type===f);
  if(cur && !curFolder){ cur=null; store.currentFolder=null; }

  // abas no topo (ao trocar de aba, volta à raiz)
  const tabs = Object.entries(STUDY_TYPES).map(([k,t])=>{
    const count=store.studies.filter(s=>s.type===k).length;
    return `<button class="study-tab ${f===k?"active":""}" style="--tab-accent:${t.accent}" onclick="setStudyFilter('${k}')">
      <span class="st-ico">${t.icon}</span><span>${t.tab}</span><span class="st-count">${count}</span></button>`;
  }).join("");

  // caminho (breadcrumb)
  const crumbs=[]; let node=curFolder;
  while(node){ crumbs.unshift(node); node=store.studyFolders.find(x=>x.id===node.parent); }
  const breadcrumb = `<div class="crumbs">
    <span class="crumb ${!cur?"active":""}" onclick="gotoFolder(null)">${T.icon} ${T.tab}</span>
    ${crumbs.map(c=>`<span class="crumb-sep">›</span><span class="crumb ${c.id===cur?"active":""}" onclick="gotoFolder('${c.id}')">${escapeHtml(c.name)}</span>`).join("")}
  </div>`;

  // pastas e estudos dentro da pasta atual
  const folders=store.studyFolders.filter(x=>x.type===f && (x.parent||null)===(cur||null));
  const studies=store.studies.filter(s=>s.type===f && (s.folder||null)===(cur||null));

  const folderCards=folders.map(fd=>{
    const nInside=store.studyFolders.filter(x=>x.parent===fd.id).length + store.studies.filter(s=>s.folder===fd.id).length;
    return `<div class="folder-card" onclick="gotoFolder('${fd.id}')">
      <div class="folder-actions">
        <button class="sys-mini" onclick="event.stopPropagation();renameFolder('${fd.id}')" title="Renomear">✎</button>
        <button class="sys-mini" onclick="event.stopPropagation();deleteFolder('${fd.id}')" title="Excluir pasta">✕</button>
      </div>
      <div class="folder-ico">📁</div>
      <div class="folder-name">${escapeHtml(fd.name)}</div>
      <div class="folder-count">${nInside} ite${nInside===1?"m":"ns"}</div>
    </div>`;
  }).join("");

  const studyCards=studies.map(s=>{
    const subtitle = s.type==="lecture"? (s.speaker||"Palestrante —") : (s.teacher||"Professor —");
    const extra = s.type==="lecture"? (s.date||s.place||"") : (s.school||"");
    return `<div class="study-card" onclick="openStudy('${s.id}')">
      <div class="study-cover" style="background:${T.cover}">
        <span class="study-cover-ico">${T.icon}</span>
        <div class="study-actions">
          <button class="sys-mini" onclick="event.stopPropagation();moveStudyPrompt('${s.id}')" title="Mover para pasta">📁</button>
          <button class="sys-mini" onclick="event.stopPropagation();editStudyMeta('${s.id}')" title="Editar dados">✎</button>
          <button class="sys-mini" onclick="event.stopPropagation();deleteStudy('${s.id}')" title="Deletar">✕</button>
        </div>
      </div>
      <div class="study-body">
        <div class="study-title">${escapeHtml(studyTitle(s))}</div>
        <div class="study-sub">${escapeHtml(subtitle)}</div>
        ${extra?`<div class="study-extra">${escapeHtml(extra)}</div>`:""}
        <div class="study-foot"><span style="color:${T.accent}">Abrir estudo →</span></div>
      </div>
    </div>`;
  }).join("");

  const isEmpty = !folders.length && !studies.length;
  const grid = isEmpty
    ? `<div class="empty-tech" style="grid-column:1/-1">
        <div class="et-ico" style="background:radial-gradient(circle at 50% 30%,${T.accent}44,var(--card-2))">${T.icon}</div>
        <div class="et-title">${cur?"Pasta vazia":"Nenhum estudo de "+T.tab.toLowerCase()+" ainda"}</div>
        <div class="et-sub">Crie uma pasta para organizar (ex.: por escola ou evento) ou adicione um estudo aqui mesmo.</div>
        <div class="row center" style="margin-top:6px">
          <button class="btn" onclick="newFolder('${f}')">📁 Nova pasta</button>
          <button class="btn btn-accent" onclick="createStudy('${f}')">+ Criar ${T.name.toLowerCase()}</button>
        </div>
      </div>`
    : `<div class="study-grid">${folderCards}${studyCards}</div>`;

  return `<div class="grid">
    <div class="row" style="align-items:center">
      <div class="page-head"><div class="ph-ico" style="background:linear-gradient(135deg,${T.accent},${T.accent}aa)">${T.icon}</div>
        <div><h1>Estudos</h1><div class="sub">${T.tagline}</div></div></div>
      <div class="spacer"></div>
      <button class="btn" onclick="newFolder('${f}')">📁 Nova pasta</button>
      <button class="btn btn-accent" onclick="createStudy('${f}')">+ Novo ${T.name.toLowerCase()}</button>
    </div>
    <div class="study-tabs">${tabs}</div>
    ${breadcrumb}
    ${grid}
  </div>`;
}

/* ===== Pastas de estudo ===== */
function gotoFolder(id){ store.currentFolder=id; render(); }
function newFolder(type){
  askInput({title:"Nova pasta", label:"Nome da pasta:", ph:"Ex.: Faculdade X", okLabel:"Criar", onOk:(name)=>{
    if(!name)return; store.studyFolders.push({ id:uid(), type, name, parent:store.currentFolder||null }); persist(); render();
  }});
}
function renameFolder(id){
  const fd=store.studyFolders.find(x=>x.id===id); if(!fd) return;
  askInput({title:"Renomear pasta", label:"Novo nome da pasta:", value:fd.name, onOk:(name)=>{
    if(!name)return; fd.name=name; persist(); render();
  }});
}
function deleteFolder(id){
  const nInside=store.studyFolders.filter(x=>x.parent===id).length + store.studies.filter(s=>s.folder===id).length;
  const msg = nInside>0
    ? `Esta pasta tem ${nInside} item(ns) dentro. Ao excluir, o conteúdo volta para a pasta anterior (nada é apagado). Continuar?`
    : "Excluir esta pasta vazia?";
  askConfirm(msg, ()=>{
    const fd=store.studyFolders.find(x=>x.id===id); const parent=fd?fd.parent||null:null;
    // sobe o conteúdo um nível
    store.studyFolders.forEach(x=>{ if(x.parent===id) x.parent=parent; });
    store.studies.forEach(s=>{ if(s.folder===id) s.folder=parent; });
    store.studyFolders=store.studyFolders.filter(x=>x.id!==id);
    if(store.currentFolder===id) store.currentFolder=parent;
    persist(); render(); toast("Pasta excluída.");
  }, "Excluir pasta");
}

  const s=store.studies.find(x=>x.id===id); if(!s) return;

/* ===== Transcrição por voz (Web Speech API) + resumo local ===== */
let _recognition=null, _recState="off", _recStudyId=null; // off | recording | paused
function _micButtons(state){
  const set=(id,show)=>{ const el=document.getElementById(id); if(el) el.classList.toggle("hidden",!show); };
  set("micBtn", state==="off");
  set("micPause", state==="recording");
  set("micResume", state==="paused");
  set("micStop", state!=="off");
  const b=document.getElementById("micBtn"); if(b&&state==="off"){ b.textContent="🎙️ Iniciar"; }
}
function startTranscribe(id){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast("Seu navegador não suporta reconhecimento de voz. Use o Chrome ou Edge."); return; }
  if(_recState!=="off"){ return; }

  _recognition = new SR();
  _recognition.lang = "pt-BR";
  _recognition.continuous = true;
  _recognition.interimResults = true;
  _recStudyId = id;

  _recognition.onresult = (ev)=>{
    let interim="";
    for(let i=ev.resultIndex; i<ev.results.length; i++){
      let txt=ev.results[i][0].transcript.trim();
      if(ev.results[i].isFinal){
        if(txt){ if(!/[.!?…]$/.test(txt)) txt+="."; appendToEditor(txt+" "); }
      }
      else interim += txt;
    }
    const st=document.getElementById("micStatus");
    if(st && _recState==="recording") st.innerHTML = interim ? '<span style="color:var(--accent)">🔴 '+escapeHtml(interim)+'</span>' : "🔴 Ouvindo…";
  };
  _recognition.onerror = (e)=>{
    const st=document.getElementById("micStatus");
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      if(st) st.textContent="Permissão de microfone negada.";
      toast("Você precisa permitir o acesso ao microfone.");
    } else if(st && e.error!=="no-speech") st.textContent="Erro: "+e.error;
  };
  // reinicia automaticamente enquanto estiver gravando (o navegador corta sozinho às vezes)
  _recognition.onend = ()=>{ if(_recState==="recording"){ try{_recognition.start();}catch{} } };

  try{
    _recognition.start(); _recState="recording"; _micButtons("recording");
    const st=document.getElementById("micStatus"); if(st) st.textContent="🔴 Ouvindo…";
    toast("Gravação iniciada.");
  }catch(e){ toast("Não foi possível iniciar o microfone."); }
}
function pauseTranscribe(){
  if(_recState!=="recording") return;
  _recState="paused"; _micButtons("paused");
  try{ _recognition && _recognition.stop(); }catch{}

function appendToEditor(text){
  const p=document.getElementById("rtePage"); if(!p) return;
  text=(text||"").trim(); if(!text) return;
  // primeira letra maiúscula
  text = text.charAt(0).toUpperCase()+text.slice(1);
  const safe = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  // agrupa frases num parágrafo "vivo"; abre novo parágrafo a cada ~350 caracteres
  let cur = p.querySelector("p.rec-live:last-child");
  if(!cur || cur.textContent.length > 350){
    cur = document.createElement("p");
    cur.className = "rec-live";
    p.appendChild(cur);
  }
  cur.innerHTML += (cur.innerHTML ? " " : "") + safe;

  // remove um <p> vazio inicial, se existir
  const first=p.querySelector("p");
  if(first && !first.textContent.trim() && p.children.length>1) first.remove();

  const doc=p.closest(".rte-doc"); if(doc) doc.scrollTop=doc.scrollHeight;
  updateRteState();
  clearTimeout(_saveTimer); _saveTimer=setTimeout(persistActiveNote,800);
}

/* Resumo simples local (sem IA): extrai frases mais relevantes por frequência de palavras */
function gerarResumo(id){
  const s=store.studies.find(x=>x.id===id); if(!s) return;
  const p=document.getElementById("rtePage");
  if(!p) return;
  // remove qualquer resumo anterior antes de gerar um novo (evita empilhar)
  p.querySelectorAll(".resumo-auto").forEach(el=>el.remove());
  // limpa também resumos antigos (versão anterior, com estilo embutido)
  p.querySelectorAll("div[style*='fff6d8']").forEach(el=>el.remove());
  const texto=p.innerText.trim();
  if(texto.split(/\s+/).length < 30){ toast("Texto muito curto para resumir. Transcreva mais conteúdo primeiro."); return; }

  const resumo = resumirTexto(texto);
  const bloco=document.createElement("div");
  bloco.className="resumo-auto";
  bloco.setAttribute("contenteditable","false");
  bloco.innerHTML=`<strong>📝 Resumo automático</strong><br>${escapeHtml(resumo).replace(/\n/g,"<br>")}`;
  p.insertBefore(bloco, p.firstChild);
  persistActiveNote();
  toast("Resumo gerado (substitui o anterior).");
}
function resumirTexto(texto){
  // 1) separa em frases
  const frases = texto.replace(/\s+/g," ").match(/[^.!?]+[.!?]+/g) || [texto];
  if(frases.length<=3) return frases.join(" ");
  // 2) frequência de palavras (ignora muito comuns)
  const stop=new Set("a o e de da do que em para com os as um uma no na se por mais como mas foi ser tem já ou eu você ele ela nós eles isso esse essa está são dos das ao à".split(" "));
  const freq={};
  texto.toLowerCase().replace(/[^\wà-úâ-û ]/g," ").split(/\s+/).forEach(w=>{
    if(w.length>3 && !stop.has(w)) freq[w]=(freq[w]||0)+1;
  });
  // 3) pontua cada frase pela soma das frequências
  const scored = frases.map((f,i)=>{
    let sc=0; f.toLowerCase().split(/\s+/).forEach(w=>{ w=w.replace(/[^\wà-úâ-û]/g,""); if(freq[w]) sc+=freq[w]; });
    return { f:f.trim(), sc, i };
  });
  // 4) pega as melhores (até 5), reordena na ordem original
  const top = scored.slice().sort((a,b)=>b.sc-a.sc).slice(0, Math.min(5, Math.ceil(frases.length*0.3)));
  top.sort((a,b)=>a.i-b.i);
  return "• " + top.map(t=>t.f).join("\n• ");
}

function renderLinks(txt){

/* Converte o HTML da transcrição em texto limpo e legível (parágrafos separados) */
function htmlToText(html){
  if(!html) return "";
  let s=html
    .replace(/<(p|div|h1|h2|h3|blockquote|li)[^>]*>/gi,"\n\n")  // quebra ao ABRIR bloco
    .replace(/<\/(p|div|h1|h2|h3|blockquote|li)>/gi,"\n\n")       // e ao fechar
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/<[^>]+>/g,"")            // remove tags restantes
    .replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&").replace(/&lt;/gi,"<").replace(/&gt;/gi,">").replace(/&#39;/gi,"'").replace(/&quot;/gi,'"');
  // normaliza espaços e quebras
  s=s.split("\n").map(l=>l.replace(/\s+/g," ").trim()).join("\n");
  return s.replace(/\n{3,}/g,"\n\n").trim();
}
/* Baixa a transcrição num arquivo de texto legível (abre em Documentos, Word, Bloco de Notas) */
function baixarTranscricao(id){
  const s=store.studies.find(x=>x.id===id); if(!s){ toast("Estudo não encontrado."); return; }
  const T=STUDY_TYPES[s.type]||{name:"Estudo"};
  const titulo=studyTitle(s);
  const dataHoje=new Date().toLocaleDateString("pt-BR");
  const linhas=[];
  linhas.push(titulo);
  linhas.push("=".repeat(Math.min(titulo.length,60)));
  linhas.push(`Tipo: ${T.name}  ·  Salvo em: ${dataHoje}`);
  T.fields?.forEach(fl=>{ if(s[fl.k]) linhas.push(`${fl.label}: ${s[fl.k]}`); });
  linhas.push("");
  const corpo=htmlToText(s.html||"");
  if(corpo){ linhas.push(s.type==="lecture"?"TRANSCRIÇÃO DA PALESTRA":s.type==="course"?"TRANSCRIÇÃO DA AULA":"CONTEÚDO"); linhas.push(""); linhas.push(corpo); linhas.push(""); }
  if(s.liveNotes && s.liveNotes.trim()){ linhas.push(""); linhas.push("MINHAS ANOTAÇÕES"); linhas.push(""); linhas.push(s.liveNotes.trim()); }
  const texto=linhas.join("\n");
  const nomeArq=titulo.replace(/[^\w\sÀ-ÿ-]/g,"").trim().replace(/\s+/g,"_")+".txt";
  const blob=new Blob([texto],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nomeArq; a.click();
  toast("Arquivo salvo na sua pasta de Downloads ✓");
}
function exportStudy(id){
  const s=store.studies.find(x=>x.id===id); if(!s)return; const T=STUDY_TYPES[s.type];
  let md=`# ${studyTitle(s)}\n\n_Tipo: ${T.name}_\n\n`;
  T.fields.forEach(fl=>{ if(s[fl.k]) md+=`**${fl.label}:** ${s[fl.k]}\n\n`; });
  if(s.links) md+=`## Links\n${s.links}\n\n`;
  if(s.notesField) md+=`## Dados interessantes\n${s.notesField}\n\n`;
  if(s.liveNotes) md+=`## Minhas anotações\n${s.liveNotes}\n\n`;
  const corpoTitulo = (s.type==="lecture"||s.type==="course") ? "Transcrição" : "Estudo";
  md+=`## ${corpoTitulo}\n\n${htmlToMarkdown(s.html||"")}\n`;
  const blob=new Blob([md],{type:"text/markdown;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=studyTitle(s).replace(/[^\w\s-]/g,"")+".md"; a.click();
  toast("Estudo exportado em Markdown.");
}

/* Conversão simples Markdown <-> HTML para manter compatibilidade das notas antigas/Zettelkasten */
function markdownToHtml(md){
  if(!md) return "";
  let body=md.replace(/^---[\s\S]*?---\s*/,""); // tira frontmatter
  return body
    .replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>")
    .replace(/^> (.*)$/gm,"<blockquote>$1</blockquote>")
    .replace(/\*\*(.*?)\*\*/g,"<b>$1</b>").replace(/\*(.*?)\*/g,"<i>$1</i>")
    .replace(/\[\[(.*?)\]\]/g,'<a href="#">$1</a>')
    .split(/\n{2,}/).map(b=>/^<(h\d|blockquote|ul|ol)/.test(b.trim())?b:`<p>${b.replace(/\n/g,"<br>")}</p>`).join("");
}
function htmlToMarkdown(html){
  let s=html
    .replace(/<h1[^>]*>(.*?)<\/h1>/gi,"# $1\n\n").replace(/<h2[^>]*>(.*?)<\/h2>/gi,"## $1\n\n").replace(/<h3[^>]*>(.*?)<\/h3>/gi,"### $1\n\n")
    .replace(/<blockquote[^>]*>(.*?)<\/blockquote>/gi,"> $1\n\n")
    .replace(/<(b|strong)[^>]*>(.*?)<\/\1>/gi,"**$2**").replace(/<(i|em)[^>]*>(.*?)<\/\1>/gi,"*$2*")
    .replace(/<br\s*\/?>/gi,"\n").replace(/<\/p>/gi,"\n\n").replace(/<[^>]+>/g,"");
  return s.replace(/\n{3,}/g,"\n\n").trim();
}

/* ===== Slides estruturados (texto + imagem) ===== */
function getSlides(l){
  // migra o campo antigo "audience" (texto) para slides, uma vez
  if(!l.slides){
    if(l.audience && l.audience.trim()){
      l.slides = l.audience.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).map(t=>({id:uid(),text:t,image:""}));
    } else l.slides=[];
  }
  return l.slides;
}
function renderSlideEditor(l){
  const slides=getSlides(l);
  if(!slides.length) return `<div class="empty" style="padding:20px">Nenhum slide ainda. Clique em <strong>+ Adicionar slide</strong> para criar o que a plateia vai ver.</div>`;
  return `<div class="slide-list">` + slides.map((s,i)=>`
    <div class="slide-item">
      <div class="slide-num">${i+1}</div>
      <div style="flex:1;min-width:0">
        <textarea class="field" style="min-height:52px;margin:0 0 8px" placeholder="Texto do slide (título, frase, versículo…) — pode deixar vazio se só quiser imagem"
          oninput="updateSlideText('${l.id}','${s.id}',this.value)">${escapeHtml(s.text||"")}</textarea>
        <div class="row" style="gap:8px;align-items:center">
          ${s.image
            ? `<img src="${s.image}" class="slide-thumb"><button class="btn btn-sm" onclick="removeSlideImage('${l.id}','${s.id}')">Remover imagem</button>`
            : `<button class="btn btn-sm" onclick="document.getElementById('slideImg_${s.id}').click()">🖼️ Adicionar imagem</button>`}
          <input type="file" id="slideImg_${s.id}" class="hidden" accept="image/*" onchange="pickSlideImage('${l.id}','${s.id}',event)">
          <div class="spacer"></div>
          <button class="sys-mini" onclick="moveSlide('${l.id}','${s.id}',-1)" title="Subir">↑</button>
          <button class="sys-mini" onclick="moveSlide('${l.id}','${s.id}',1)" title="Descer">↓</button>
          <button class="sys-mini" onclick="deleteSlide('${l.id}','${s.id}')" title="Remover slide">✕</button>
        </div>
      </div>
    </div>`).join("") + `</div>`;
}
function addSlide(id){ const l=store.lectures.find(x=>x.id===id); if(!l)return; getSlides(l).push({id:uid(),text:"",image:""}); persist(); render(); }
function updateSlideText(id,sid,v){ const l=store.lectures.find(x=>x.id===id); const s=getSlides(l).find(x=>x.id===sid); if(!s)return; s.text=v; persist(); pushTelao(id); }
function deleteSlide(id,sid){ const l=store.lectures.find(x=>x.id===id); l.slides=getSlides(l).filter(x=>x.id!==sid); persist(); render(); pushTelao(id); }
function moveSlide(id,sid,dir){ const l=store.lectures.find(x=>x.id===id); const arr=getSlides(l);
  const i=arr.findIndex(x=>x.id===sid); const j=i+dir; if(i<0||j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]]; persist(); render(); pushTelao(id); }
function pickSlideImage(id,sid,ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    // comprime a imagem pra caber no localStorage (máx ~1600px, JPEG)
    const img=new Image();
    img.onload=()=>{
      const max=1600; let {width:w,height:h}=img;
      if(w>max||h>max){ const k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k); }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      let dataUrl; try{ dataUrl=cv.toDataURL("image/jpeg",0.82); }catch{ dataUrl=r.result; }
      const l=store.lectures.find(x=>x.id===id); const s=getSlides(l).find(x=>x.id===sid); if(!s)return;
      s.image=dataUrl;
      try{ persist(); }catch(e){ toast("Imagem muito grande para o armazenamento local."); return; }
      render(); pushTelao(id); toast("Imagem adicionada ao slide.");
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}
function removeSlideImage(id,sid){ const l=store.lectures.find(x=>x.id===id); const s=getSlides(l).find(x=>x.id===sid); if(!s)return; s.image=""; persist(); render(); pushTelao(id); }

/* ===== Tela da plateia (segunda janela / projetor) ===== */
let _telaoWin=null;
function abrirTelaoPlateia(id){
  const l=store.lectures.find(x=>x.id===id); if(!l) return;
  _telaoWin = window.open("", "telaoPlateia", "width=1280,height=720");
  if(!_telaoWin){ toast("O navegador bloqueou a janela. Permita pop-ups para este site."); return; }
  const doc=_telaoWin.document;
  doc.open();
  doc.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${escapeHtml(l.name||"Apresentação")}</title>
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{height:100%;background:#0a0f1e;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;}
      #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 6vw;text-align:center;gap:4vh;}
      #img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:10px;display:none;opacity:0;transition:opacity .35s;}
      #img.show{display:block;opacity:1;}
      #txt{font-size:min(6vw,64px);font-weight:700;line-height:1.35;white-space:pre-wrap;opacity:0;transition:opacity .35s;max-width:100%;}
      #txt.show{opacity:1;}
      #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#3a4a63;font-size:14px;}
      #counter{position:fixed;top:14px;right:20px;color:#3a4a63;font-size:14px;}
      #blank{position:fixed;inset:0;background:#000;display:none;}
    </style></head><body>
    <div id="wrap"><img id="img"><div id="txt"></div></div>
    <div id="counter"></div>
    <div id="hint">← → muda o slide · B tela preta · F tela cheia · Esc fecha</div>
    <div id="blank"></div>
    <script>
      let slides=[], idx=0;
      function show(){
        const t=document.getElementById('txt'), im=document.getElementById('img');
        t.classList.remove('show'); im.classList.remove('show');
        setTimeout(()=>{
          const s=slides[idx]||{text:'',image:''};
          if(s.image){ im.src=s.image; im.classList.add('show'); } else { im.classList.remove('show'); im.src=''; }
          t.textContent=s.text||''; if(s.text) t.classList.add('show');
          document.getElementById('counter').textContent = slides.length?((idx+1)+' / '+slides.length):'';
        },180);
      }
      window.addEventListener('message',e=>{
        if(e.data && e.data.type==='slides'){ slides=e.data.slides||[]; if(idx>=slides.length) idx=Math.max(0,slides.length-1); show(); }
      });
      document.addEventListener('keydown',e=>{
        if(e.key==='ArrowRight'||e.key===' '){ if(idx<slides.length-1){idx++;show();} }
        else if(e.key==='ArrowLeft'){ if(idx>0){idx--;show();} }
        else if(e.key.toLowerCase()==='b'){ const b=document.getElementById('blank'); b.style.display=b.style.display==='block'?'none':'block'; }
        else if(e.key.toLowerCase()==='f'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
      });
    <\/script></body></html>`);
  doc.close();
  setTimeout(()=>pushTelao(id), 400);
  toast("Tela da plateia aberta. Arraste-a para o projetor e aperte F para tela cheia.");
}
function pushTelao(id){
  if(!_telaoWin || _telaoWin.closed) return;
  const l=store.lectures.find(x=>x.id===id); if(!l) return;
  const slides=getSlides(l).map(s=>({text:s.text||"",image:s.image||""}));
  _telaoWin.postMessage({type:"slides", slides}, "*");
}

document.getElementById("logoutBtn").onclick=logout;
document.getElementById("sideToggle").onclick=()=>document.getElementById("sidebar").classList.toggle("collapsed");
document.getElementById("loginSubmit").onclick=submitLogin;
document.getElementById("loginToggle").onclick=()=>{ store.loginMode=store.loginMode==="login"?"register":"login"; document.getElementById("loginErr").textContent=""; document.getElementById("loginMsg").textContent=""; renderLoginChips(); };
document.getElementById("loginPass").addEventListener("keydown",e=>{ if(e.key==="Enter")submitLogin(); });
document.getElementById("forgotLink").onclick=forgotPassword;
window.addEventListener("keydown",e=>{ const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==="p"){ e.preventDefault(); overlay.classList.contains("show")?closePalette():openPalette(); }
  if(e.key==="Escape"){ closePalette(); closeModal(); }
  // atalhos do editor quando o cursor está na página de edição
  if(mod && document.activeElement?.id==="rtePage"){
    const k=e.key.toLowerCase();
    if(k==="b"||k==="i"||k==="u"){ setTimeout(()=>{ updateRteState(); persistActiveNote(); },0); }
    if(k==="s"){ e.preventDefault(); persistActiveNote(); const s=document.getElementById("rteSaved"); if(s)s.textContent="Salvo"; toast("Nota salva."); }
  }
});

/* BOOT */
renderLoginChips();
/* pré-preenche o e-mail lembrado */
try{
  const rem=localStorage.getItem("kh_remember_email");
  if(rem){ const f=document.getElementById("loginUser"); if(f) f.value=rem;
    const c=document.getElementById("rememberEmail"); if(c) c.checked=true; }
}catch(e){}
carregarBibliaCompleta();  // tenta carregar biblia.json (Bíblia completa offline)

/* Auto-login: se o Firebase já tem sessão ativa (voltou ao site), entra direto. */
if(FB_OK){
  fbAuth.onAuthStateChanged(async(u)=>{
    if(u && !store.user){ await carregarPerfilESessao(u.uid); }
  });
}
</script></body></html>
