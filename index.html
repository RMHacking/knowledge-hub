<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knowledge Hub — por Rafael Moreno</title>
<style>
  :root{
    --bg:#0a0e14; --bg-2:#0d1117; --sidebar:#0c1119; --card:#121926; --card-2:#161f2e;
    --fg:#e6edf3; --muted:#8b98a9; --border:#1e2836; --accent:#2f81f7; --accent-2:#1f6feb;
    --danger:#f85149; --ok:#3fb950; --warn:#e3b341; --radius:14px;
    --font-ui:-apple-system,"Segoe UI",system-ui,"Roboto",sans-serif;
    --font-serif:"Iowan Old Style","Palatino",Cambria,Georgia,serif;
  }
  [data-theme="light"]{ --bg:#f2f4f8; --bg-2:#fff; --sidebar:#fff; --card:#fff; --card-2:#f6f8fb;
    --fg:#1d2430; --muted:#5b6675; --border:#e2e8f0; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);height:100vh;overflow:hidden;}
  .spacer{flex:1;} .hidden{display:none !important;}
  input,textarea,select{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  .btn{border:1px solid var(--border);background:var(--card);color:var(--fg);padding:8px 14px;
    border-radius:10px;font-size:13px;cursor:pointer;transition:.12s;}
  .btn:hover{background:var(--card-2);border-color:var(--accent);}
  .btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-accent:hover{background:var(--accent-2);}
  .btn-danger{color:var(--danger);border-color:transparent;background:transparent;}
  .btn-danger:hover{background:rgba(248,81,73,.12);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover{background:var(--card-2);}
  .field{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-2);color:var(--fg);margin-bottom:10px;font-size:14px;outline:none;}
  .field:focus{border-color:var(--accent);}

  /* ---------- LOGIN ---------- */
  #loginScreen{height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 100% at 50% 0%, #10203a 0%, var(--bg) 55%);}
  .login-card{width:380px;max-width:92vw;padding:36px;border:1px solid var(--border);border-radius:20px;
    background:var(--card);box-shadow:0 30px 80px rgba(0,0,0,.5);}
  .login-card .logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#7cc4ff);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#fff;margin-bottom:16px;}
  .login-card h1{margin:0;font-size:23px;} .login-card .sub{color:var(--muted);font-size:13px;margin:2px 0 22px;}
  .acct-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  /* Campo de senha com olhinho */
  .pass-wrap{position:relative;}
  .pass-wrap input{width:100%;padding-right:42px;}
  .pass-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;
    opacity:.6;user-select:none;background:none;border:none;padding:2px;line-height:1;}
  .pass-eye:hover{opacity:1;}
  .login-row{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px;font-size:13px;}
  .login-remember{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;}
  .login-forgot{color:var(--accent);text-decoration:none;}
  .login-forgot:hover{text-decoration:underline;}

  /* ---------- APP SHELL ---------- */
  #app{display:none;height:100vh;}
  .layout{display:flex;height:100vh;}

  /* Sidebar */
  .sidebar{width:250px;flex:0 0 250px;background:var(--sidebar);border-right:1px solid var(--border);
    display:flex;flex-direction:column;transition:.16s;overflow:hidden;}
  .sidebar.collapsed{width:64px;flex:0 0 64px;}
  .side-profile{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;cursor:pointer;}
  .side-profile:hover{background:var(--card-2);}
  .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:0 0 42px;
    background:linear-gradient(135deg,var(--accent),#7cc4ff);color:#fff;display:flex;align-items:center;
    justify-content:center;font-weight:600;font-size:16px;border:2px solid var(--border);}
  .side-profile .who{min-width:0;}
  .side-profile .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .side-profile .role{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .side-tag{display:inline-block;margin:8px 16px 4px;padding:3px 10px;border-radius:20px;font-size:11px;
    background:rgba(47,129,247,.16);color:var(--accent);font-weight:600;}
  .sidebar.collapsed .who,.sidebar.collapsed .side-tag,.sidebar.collapsed .side-group-label,
  .sidebar.collapsed .side-item span.lbl{display:none;}

  .side-scroll{flex:1;overflow:auto;padding:8px 0;}
  .side-group-label{font-size:11px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;
    padding:14px 20px 6px;font-weight:600;}
  .side-item{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;font-size:14px;
    color:var(--fg);border-left:3px solid transparent;}
  .side-item:hover{background:var(--card-2);}
  .side-item.active{background:linear-gradient(90deg,rgba(47,129,247,.18),transparent);
    border-left-color:var(--accent);color:#fff;font-weight:600;}
  .side-dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--muted);opacity:.5;
    transition:.16s;margin-left:4px;}
  .side-item:hover .side-dot{background:var(--accent);opacity:1;box-shadow:0 0 10px var(--accent),0 0 4px var(--accent);}
  .side-item.active .side-dot{background:var(--accent);opacity:1;box-shadow:0 0 12px var(--accent),0 0 5px var(--accent);}
  .sidebar.collapsed .side-dot{margin:0 auto;}
  .side-foot{padding:10px;border-top:1px solid var(--border);display:flex;gap:6px;}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{height:62px;flex:0 0 62px;display:flex;align-items:center;gap:12px;padding:0 22px;
    border-bottom:1px solid var(--border);background:var(--bg-2);}
  .topbar .toggle{cursor:pointer;color:var(--muted);font-size:18px;padding:6px;border-radius:8px;}
  .topbar .toggle:hover{background:var(--card-2);}
  .topbar .title{font-size:17px;font-weight:600;}
  .topbar .brand{font-size:18px;font-weight:700;letter-spacing:.3px;}
  .topbar .brand b{color:var(--accent);}
  .topbar .date{color:var(--muted);font-size:13px;}
  .content{flex:1;overflow:auto;
    background-image:
      linear-gradient(rgba(47,129,247,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(47,129,247,.035) 1px,transparent 1px);
    background-size:32px 32px;}
  [data-theme="light"] .content{background-image:
      linear-gradient(rgba(47,129,247,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(47,129,247,.06) 1px,transparent 1px);}

  /* Cabeçalho de página com ícone grande */
  .page-head{display:flex;align-items:center;gap:16px;}
  .page-head .ph-ico{width:52px;height:52px;flex:0 0 52px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;font-size:24px;background:linear-gradient(135deg,var(--accent),#7cc4ff);color:#fff;
    box-shadow:0 8px 22px rgba(47,129,247,.4);}
  .page-head h1{margin:0;font-size:23px;font-weight:700;}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:2px;}

  /* Estado vazio tech */
  .empty{padding:56px 24px;color:var(--muted);text-align:center;font-size:14px;}
  .empty-tech{display:flex;flex-direction:column;align-items:center;gap:16px;padding:60px 24px;text-align:center;}
  .empty-tech .et-ico{width:88px;height:88px;border-radius:24px;display:flex;align-items:center;justify-content:center;
    font-size:40px;background:radial-gradient(circle at 50% 30%,rgba(47,129,247,.25),var(--card-2));
    border:1px solid var(--border);box-shadow:inset 0 0 40px rgba(47,129,247,.12);}
  .empty-tech .et-title{font-size:16px;font-weight:600;color:var(--fg);}
  .empty-tech .et-sub{font-size:13px;color:var(--muted);max-width:360px;line-height:1.6;}

  /* Cabeçalho CRUD */
  .item-header{display:flex;gap:8px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--border);background:var(--bg-2);}
  .item-header strong{font-size:15px;}

  /* Cards */
  .grid{padding:22px;display:flex;flex-direction:column;gap:18px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .card-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;}
  .metric .label{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .metric .m-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:20px;color:#fff;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.3);}
  .metric .val{font-size:28px;font-weight:700;}
  .metric .val.blue{color:var(--accent);} .metric .val.green{color:var(--ok);} .metric .val.amber{color:var(--warn);}
  .metric .sub{font-size:12px;color:var(--muted);margin-top:4px;}

  .clock-hero{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid var(--border);
    border-radius:18px;padding:34px;text-align:center;}
  .clock-hero .big{font-size:64px;font-weight:800;letter-spacing:2px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;}
  .clock-hero .sub{color:var(--muted);margin-top:12px;font-size:14px;}

  .two-col{display:grid;grid-template-columns:1fr 320px;gap:18px;}
  @media(max-width:900px){.two-col{grid-template-columns:1fr;}}
  .card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px;}
  .list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 8px;}
  .list-row .sub{font-size:12px;color:var(--muted);}
  .timer{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);text-align:center;margin:6px 0;}
  .timer.danger{color:var(--danger);}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .center{justify-content:center;}

  .note-banner{font-size:12px;color:var(--muted);background:var(--card-2);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;line-height:1.5;}
  .quick-list{display:flex;flex-direction:column;gap:10px;}
  .quick-chip{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);
    border-radius:12px;background:var(--card-2);cursor:pointer;font-size:13px;transition:.12s;width:100%;}
  .quick-chip:hover{border-color:var(--accent);transform:translateX(3px);background:var(--card);}
  .quick-chip .qc-ico{width:40px;height:40px;flex:0 0 40px;border-radius:11px;display:flex;align-items:center;
    justify-content:center;font-size:18px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  .quick-chip .qc-txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
  .quick-chip .qc-arrow{color:var(--muted);font-size:20px;transition:.12s;}
  .quick-chip:hover .qc-arrow{color:var(--accent);transform:translateX(3px);}

  /* Editor / listas de módulos */
  .split{display:flex;height:100%;}
  .subnav{width:260px;flex:0 0 260px;border-right:1px solid var(--border);overflow:auto;background:var(--bg-2);}
  .subnav.wide{width:220px;flex-basis:220px;}
  .nav-item{padding:11px 16px;cursor:pointer;font-size:14px;border-left:3px solid transparent;}
  .nav-item:hover{background:var(--card-2);}
  .nav-item.sel{background:linear-gradient(90deg,rgba(47,129,247,.16),transparent);border-left-color:var(--accent);color:#fff;}
  .nav-item .cnt{float:right;opacity:.6;font-size:12px;}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0;}
  /* Leitor de livro/PDF ocupa toda a altura disponível */
  .reader-pane{height:100%;display:flex;flex-direction:column;}
  .reader-body{flex:1;overflow:hidden;display:flex;min-height:0;}
  .pdf-frame{flex:1;width:100%;height:100%;border:none;background:#525659;}
  .reader-body .reader-scroll{flex:1;overflow:auto;}
  textarea.editor{width:100%;height:100%;border:none;outline:none;resize:none;padding:26px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;line-height:1.7;background:var(--bg-2);color:var(--fg);}

  /* ---------- Editor rico (estilo Word) ---------- */
  .rte-toolbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 12px;
    border-bottom:1px solid var(--border);background:var(--bg-2);position:sticky;top:0;z-index:5;}
  .rte-toolbar .grp{display:flex;gap:2px;align-items:center;padding:0 6px;border-right:1px solid var(--border);}
  .rte-toolbar .grp:last-child{border-right:none;}
  .rte-btn{min-width:32px;height:32px;padding:0 8px;border:1px solid transparent;background:transparent;
    color:var(--fg);border-radius:8px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;}
  .rte-btn:hover{background:var(--card-2);}
  .rte-btn.on{background:rgba(47,129,247,.18);color:var(--accent);}
  .rte-btn b{font-family:serif;} .rte-btn i{font-family:serif;}
  .rte-select{height:32px;border:1px solid var(--border);background:var(--card);color:var(--fg);
    border-radius:8px;font-size:13px;padding:0 6px;cursor:pointer;}
  .rte-color{width:32px;height:32px;padding:2px;border:1px solid var(--border);background:var(--card);border-radius:8px;cursor:pointer;}
  .rte-doc{flex:1;overflow:auto;background:var(--bg);display:flex;justify-content:center;padding:28px 20px;}
  .rte-page{background:#fff;color:#1a1a1a;width:100%;max-width:820px;min-height:60vh;border-radius:8px;
    box-shadow:0 6px 30px rgba(0,0,0,.25);padding:64px 72px;outline:none;font-family:var(--font-ui);
    font-size:16px;line-height:1.7;}
  [data-theme="light"] .rte-doc{background:#e9edf3;}
  .rte-page:focus{outline:none;}
  .rte-page p.rec-live{margin:0 0 14px;color:#111 !important;opacity:1 !important;} /* transcrição ao vivo: sempre legível */
  .rte-page, .rte-page *{opacity:1;} /* garante que nada fique transparente no editor */
  .rte-page h1{font-size:28px;margin:.4em 0;} .rte-page h2{font-size:22px;margin:.4em 0;}
  .rte-page blockquote{border-left:4px solid #c9b78d;margin:12px 0;padding:4px 16px;color:#555;font-style:italic;background:#faf6ec;}
  .rte-page ul,.rte-page ol{padding-left:26px;} .rte-page a{color:var(--accent);}
  .rte-page img{max-width:100%;border-radius:6px;}
  .rte-status{padding:6px 14px;border-top:1px solid var(--border);background:var(--bg-2);
    font-size:12px;color:var(--muted);display:flex;gap:14px;}

  /* Kindle */
  .kindle-surface{background:#f4ecd8;color:#3b3228;font-family:var(--font-serif);font-size:20px;line-height:1.85;
    max-width:66ch;margin:0 auto;padding:56px 44px 120px;min-height:100%;}
  .kindle-surface h1{font-size:27px;margin:0 0 24px;} .kindle-surface h2{font-size:26px;margin:0 0 6px;}
  .kindle-surface .subtle{color:#8a7c63;font-size:14px;margin-bottom:32px;font-style:italic;}
  .kindle-surface p{margin:0 0 18px;text-align:justify;}
  .kindle-surface blockquote{border-left:3px solid #c9b78d;margin:8px 0;padding-left:12px;font-style:italic;}
  .kindle-surface a{color:#7a5c1e;}
  .verse{display:block;margin:0 0 2px;padding:4px 6px;border-radius:6px;position:relative;}
  .verse:hover{background:rgba(180,150,90,.16);}
  .verse .vnum{font-size:13px;color:#a08a5e;font-weight:600;margin-right:8px;vertical-align:super;}
  .verse .quick{position:absolute;right:4px;top:3px;opacity:0;transition:.12s;font-size:11px;padding:2px 7px;
    border-radius:20px;border:1px solid #c9b78d;background:#efe4c8;color:#6b5a34;cursor:pointer;font-family:var(--font-ui);}
  .verse:hover .quick{opacity:1;} .verse .quick:hover{background:#6b5a34;color:#f4ecd8;}
  .verse.has-note{background:rgba(200,160,60,.14);border-left:3px solid #c9a03c;padding-left:8px;}
  .verse-note{font-family:var(--font-ui);font-size:13px;color:#6b5a34;background:#efe4c8;border-radius:8px;
    padding:6px 10px;margin:6px 0 2px;}
  .verse-editor{margin:8px 0;} .verse-editor textarea{width:100%;min-height:60px;padding:8px;border-radius:8px;
    border:1px solid #c9b78d;background:#fbf6e8;color:#3b3228;font-family:var(--font-ui);font-size:13px;resize:vertical;}
  /* Ferramentas do versículo (grifos + ações) — aparecem ao passar o mouse */
  .vtext{transition:background .12s;}
  .verse-tools{display:inline-flex;align-items:center;gap:5px;margin-left:8px;opacity:0;transition:.12s;
    vertical-align:middle;font-family:var(--font-ui);}
  .verse:hover .verse-tools{opacity:1;}
  .hl-dot{width:15px;height:15px;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.15);display:inline-flex;
    align-items:center;justify-content:center;font-size:10px;color:#6b5a34;transition:transform .1s;}
  .hl-dot:hover{transform:scale(1.25);}
  .hl-clear{background:#efe4c8 !important;color:#8a5a34;font-weight:700;}
  .quick2{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid #c9b78d;background:#efe4c8;color:#6b5a34;
    cursor:pointer;white-space:nowrap;}
  .quick2:hover{background:#6b5a34;color:#f4ecd8;}
  /* Painel de versículos salvos */
  .saved-verse{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card);}
  .sv-ref{font-weight:700;font-size:12px;color:var(--accent);margin-bottom:3px;}
  .sv-text{font-size:13px;color:var(--fg);line-height:1.5;}
  .toolbar{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg-2);}
  select.picker{font-size:13px;padding:7px 10px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--fg);}

  .inbox-form{padding:14px;border-bottom:1px solid var(--border);}
  .inbox-form textarea{width:100%;min-height:64px;padding:10px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-2);color:var(--fg);font-size:13px;resize:vertical;}
  .mini-card{margin:10px 14px;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:13px;background:var(--card);}
  .mini-card .meta{color:var(--muted);font-size:11px;margin-top:8px;display:flex;gap:8px;align-items:center;}

  /* Estante */
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;padding:22px;}
  .book-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card);cursor:pointer;transition:.14s;}
  .book-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.4);border-color:var(--accent);}
  .book-cover{height:150px;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);
    font-size:15px;text-align:center;padding:16px;color:#fff;background:linear-gradient(140deg,#243b53,#3b5b7d);position:relative;}
  .book-cover.epub{background:linear-gradient(140deg,#14453a,#1f7a63);}
  .book-cover.pdf{background:linear-gradient(140deg,#5a1e1e,#a03535);}
  .book-cover.md{background:linear-gradient(140deg,#1f3a5f,#2f6fb0);}
  .book-meta{padding:12px;} .book-meta .t{font-size:13px;font-weight:600;} .book-meta .a{font-size:12px;color:var(--muted);margin-top:2px;}
  .book-meta .fmt{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:6px;}
  .drop-zone{margin:22px;padding:38px;border:2px dashed var(--border);border-radius:16px;text-align:center;color:var(--muted);font-size:14px;}
  .drop-zone.drag{border-color:var(--accent);background:var(--card-2);color:var(--accent);}
  .reader-scroll{height:100%;overflow:auto;}
  .reader-page{background:#f4ecd8;color:#3b3228;font-family:var(--font-serif);line-height:1.9;max-width:64ch;margin:0 auto;padding:60px 46px 140px;}
  .prompter{height:240px;overflow:auto;background:#000;color:#fff;font-size:30px;line-height:1.6;padding:24px;text-align:center;border-radius:12px;}

  /* Overlays */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;justify-content:center;padding-top:12vh;z-index:100;}
  .overlay.show{display:flex;}
  .palette{width:560px;max-width:92vw;background:var(--card);border:1px solid var(--border);border-radius:16px;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);height:fit-content;}
  .palette input{width:100%;padding:18px;border:none;outline:none;font-size:16px;background:transparent;color:var(--fg);}
  .palette .results{max-height:340px;overflow:auto;border-top:1px solid var(--border);}
  .palette .res{padding:12px 18px;cursor:pointer;font-size:14px;} .palette .res:hover{background:var(--card-2);}
  .modal{width:460px;max-width:92vw;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;
    height:fit-content;box-shadow:0 30px 80px rgba(0,0,0,.6);}
  .modal h2{margin:0 0 18px;font-size:19px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;
    padding:11px 20px;border-radius:24px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:200;font-weight:500;}
  .toast.show{opacity:1;bottom:34px;}
  .label-sm{font-size:12px;color:var(--muted);margin-bottom:6px;}

  /* Configurações */
  .set-card{margin-bottom:0;}
  .set-card h3{margin-top:0;}

  /* Metas & Hábitos */
  .goal-ring{width:150px;height:150px;border-radius:50%;margin:6px auto;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--card-2) 0);}
  .goal-ring-inner{width:116px;height:116px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;
    align-items:center;justify-content:center;}
  .streak-box{display:flex;align-items:center;gap:14px;}
  .habit-chart{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:12px;}
  .habit-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;}
  .habit-bar-wrap{flex:1;width:100%;position:relative;display:flex;align-items:flex-end;}
  .habit-bar{width:100%;background:var(--muted);border-radius:5px 5px 0 0;min-height:3px;transition:.2s;}
  .habit-bar.hit{background:linear-gradient(180deg,#3fb98a,#1f7a63);}
  .habit-goal{position:absolute;left:0;right:0;border-top:2px dashed var(--accent);opacity:.55;}
  .habit-lbl{font-size:10px;color:var(--muted);}

  /* Agenda */
  .cal-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .cal-month{font-size:18px;font-weight:700;min-width:180px;text-align:center;}
  .cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
  .cal-legend span{display:flex;align-items:center;gap:5px;}
  .cal-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 0;font-weight:600;}
  .cal-cell{min-height:96px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:6px;cursor:pointer;
    display:flex;flex-direction:column;gap:3px;transition:.12s;overflow:hidden;}
  .cal-cell:hover{border-color:var(--accent);background:var(--card-2);}
  .cal-empty{background:transparent;border-color:transparent;cursor:default;}
  .cal-empty:hover{background:transparent;border-color:transparent;}
  .cal-today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
  .cal-daynum{font-size:13px;font-weight:600;color:var(--muted);align-self:flex-end;}
  .cal-today .cal-daynum{color:var(--accent);}
  .cal-ev{font-size:11px;color:#fff;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .cal-more{font-size:10px;color:var(--muted);padding-left:2px;}
  @media(max-width:640px){.cal-cell{min-height:64px;}.cal-ev{font-size:9px;}.cal-daynum{font-size:11px;}}

  .ag-list{display:flex;flex-direction:column;gap:8px;}
  .ag-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);}
  .ag-date{flex:0 0 52px;height:52px;border-radius:11px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
  .ag-day{font-size:20px;font-weight:800;}
  .ag-mon{font-size:10px;text-transform:uppercase;opacity:.9;}
  .ag-title{font-weight:600;}
  .ag-today{background:var(--accent);color:#fff;font-size:10px;padding:1px 7px;border-radius:20px;margin-left:4px;vertical-align:middle;}

  /* Revisão espaçada */
  .deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .deck-card{position:relative;border:1px solid var(--border);border-radius:16px;background:var(--card);padding:20px;
    display:flex;flex-direction:column;gap:6px;transition:.15s;}
  .deck-card:hover{border-color:var(--accent);box-shadow:0 12px 30px rgba(0,0,0,.35);}
  .deck-ico{font-size:34px;}
  .deck-name{font-weight:700;font-size:16px;}
  .deck-stats{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .deck-due{color:#f59e0b;font-weight:600;}
  .deck-ok{color:#3fb98a;font-weight:600;}
  .deck-actions{position:absolute;top:10px;right:10px;display:flex;gap:5px;opacity:0;transition:.14s;}
  .deck-card:hover .deck-actions{opacity:1;}
  .review-progress{height:6px;background:var(--card-2);border-radius:20px;overflow:hidden;}
  .review-progress>div{height:100%;background:linear-gradient(90deg,var(--accent),#7cc4ff);transition:width .3s;}
  .flashcard{min-height:240px;border:1px solid var(--border);border-radius:18px;background:var(--card);
    padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
    cursor:pointer;transition:.15s;}
  .flashcard:hover{border-color:var(--accent);}
  .fc-side-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .fc-q{font-size:22px;font-weight:700;line-height:1.4;}
  .fc-a{font-size:19px;line-height:1.5;color:var(--fg);}
  .fc-div{width:60%;border:none;border-top:1px dashed var(--border);margin:6px 0;}
  .fc-hint{font-size:13px;color:var(--muted);font-style:italic;}
  .review-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .review-btns .btn{flex-direction:column;padding:12px 8px;font-weight:700;line-height:1.3;}
  .review-btns .btn span{font-size:11px;font-weight:400;opacity:.8;}
  .rev-again{background:#5a1e1e;color:#fff;border-color:#7a2a2a;}
  .rev-hard{background:#5a3d1e;color:#fff;border-color:#7a552a;}
  .rev-good{background:#1f4d3a;color:#fff;border-color:#2a6a50;}
  .rev-easy{background:#1f3a5f;color:#fff;border-color:#2a5080;}
  .review-btns .btn:hover{filter:brightness(1.2);}
  @media(max-width:560px){.review-btns{grid-template-columns:repeat(2,1fr);}}
  /* Modo apresentação */
  .present-hero{display:flex;align-items:center;gap:16px;
    background:linear-gradient(135deg,rgba(130,87,181,.18),transparent);border-color:#8257b5;}
  .present-hero button{white-space:nowrap;}
  @media(max-width:640px){.present-hero{flex-direction:column;align-items:flex-start;}}
  .slide-list{display:flex;flex-direction:column;gap:10px;}
  .slide-item{display:flex;gap:10px;padding:10px;border:1px solid var(--border);border-radius:11px;background:var(--card-2);}
  .slide-num{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
  .slide-thumb{height:44px;border-radius:6px;border:1px solid var(--border);object-fit:cover;}
  .set-profile{display:flex;gap:16px;align-items:center;margin-bottom:18px;}
  .set-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  @media(max-width:640px){.set-grid{grid-template-columns:1fr;}}
  .set-acct-list{display:flex;flex-direction:column;gap:8px;}
  .set-acct{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);
    border-radius:11px;background:var(--card-2);}

  /* Barra de transcrição por voz */
  .transcribe-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);
    background:linear-gradient(90deg,rgba(47,129,247,.1),transparent);}
  #micStop.btn, #micPause.btn{}
  .transcribe-bar #micStatus{margin-left:4px;}

  /* Área dividida: transcrição + anotações ao vivo */
  .rec-split{flex:1;display:flex;overflow:hidden;}
  .rec-col{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
  .rec-col-notes{flex:0 0 260px;border-left:1px solid var(--border);background:var(--bg-2);}
  .rec-col-head{padding:8px 16px;font-size:12px;font-weight:600;color:var(--muted);
    border-bottom:1px solid var(--border);background:var(--bg-2);}
  .live-notes{flex:1;width:100%;border:none;outline:none;resize:none;padding:16px;background:var(--bg-2);
    color:var(--fg);font-size:14px;line-height:1.7;font-family:var(--font-ui);}
  /* Editor da transcrição ao vivo: usa a largura toda da coluna, sem margens gigantes */
  .rec-split .rte-doc{padding:0;background:#fff;}
  .rec-split .rte-page{max-width:none;width:100%;min-height:100%;border-radius:0;box-shadow:none;
    padding:24px 40px;font-size:18px;line-height:1.8;}
  .resumo-auto{background:#fff6d8;color:#4a3d10;border-left:4px solid #e3b341;padding:12px 16px;
    margin-bottom:18px;border-radius:8px;font-size:15px;line-height:1.6;}
  /* Em telas mais estreitas, empilha as anotações embaixo (transcrição ganha largura total) */
  @media(max-width:1100px){.rec-split{flex-direction:column;}.rec-col-notes{flex:0 0 180px;border-left:none;border-top:1px solid var(--border);}}

  /* Estudos — abas por tipo */
  .study-tabs{display:flex;gap:10px;flex-wrap:wrap;}
  .study-tab{display:flex;align-items:center;gap:9px;padding:12px 18px;border-radius:13px;cursor:pointer;
    background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:14px;font-weight:600;transition:.14s;}
  .study-tab:hover{border-color:var(--tab-accent);color:var(--fg);}
  .study-tab.active{background:var(--card-2);
    border-color:var(--tab-accent);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.35), inset 0 0 0 1px var(--tab-accent);}
  .study-tab .st-ico{font-size:18px;}
  .study-tab .st-count{background:var(--bg-2);border:1px solid var(--border);border-radius:20px;
    font-size:11px;padding:1px 8px;color:var(--muted);}
  .study-tab.active .st-count{background:var(--tab-accent);color:#fff;border-color:transparent;}

  /* Estudos — cards */
  .study-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}

  /* Pastas de estudo */
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;margin:2px 0;}
  .crumb{cursor:pointer;color:var(--muted);padding:3px 8px;border-radius:7px;}
  .crumb:hover{background:var(--card-2);color:var(--fg);}
  .crumb.active{color:var(--fg);font-weight:600;}
  .crumb-sep{color:var(--muted);}
  .folder-card{position:relative;border:1px solid var(--border);border-radius:16px;background:var(--card);cursor:pointer;
    transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px 16px;text-align:center;}
  .folder-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.4);border-color:var(--accent);}
  .folder-ico{font-size:44px;line-height:1;}
  .folder-name{font-weight:700;font-size:15px;}
  .folder-count{font-size:12px;color:var(--muted);}
  .folder-actions{position:absolute;top:8px;right:8px;display:flex;gap:5px;opacity:0;transition:.14s;}
  .folder-card:hover .folder-actions{opacity:1;}
  .move-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;}
  .move-opt{padding:10px 12px;border:1px solid var(--border);border-radius:9px;cursor:pointer;background:var(--card-2);}
  .move-opt:hover{border-color:var(--accent);}
  .move-opt.sel{border-color:var(--accent);background:rgba(47,129,247,.12);font-weight:600;}

  .study-card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--card);cursor:pointer;
    transition:.15s;display:flex;flex-direction:column;}
  .study-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.45);border-color:var(--accent);}
  .study-cover{height:96px;display:flex;align-items:center;justify-content:center;position:relative;}
  .study-actions{position:absolute;top:8px;right:8px;display:flex;gap:5px;opacity:0;transition:.14s;}
  .study-card:hover .study-actions{opacity:1;}
  .study-actions .sys-mini{background:rgba(0,0,0,.4);border-color:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(4px);}
  .study-actions .sys-mini:hover{background:var(--danger);border-color:var(--danger);}
  .study-cover-ico{font-size:38px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
  .study-body{padding:16px;display:flex;flex-direction:column;gap:4px;}
  .study-title{font-weight:700;font-size:15px;line-height:1.3;}
  .study-sub{font-size:13px;color:var(--fg);opacity:.85;}
  .study-extra{font-size:12px;color:var(--muted);}
  .study-foot{margin-top:8px;font-size:13px;font-weight:600;}

  /* Meus Sistemas — lista em cascata */
  .sys-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;text-decoration:none;
    color:var(--fg);transition:.12s;border:1px solid transparent;}
  .sys-row:hover{background:var(--card-2);border-color:var(--accent);transform:translateX(3px);}
  .sys-row + .sys-row{margin-top:4px;}
  .sysrow-ico{width:48px;height:48px;flex:0 0 48px;border-radius:13px;display:flex;align-items:center;
    justify-content:center;font-weight:700;color:#fff;font-size:18px;box-shadow:0 6px 16px rgba(0,0,0,.35);overflow:hidden;}
  .sysrow-name{font-weight:600;font-size:15px;}
  .sysrow-cat{font-size:12px;color:var(--muted);text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sysrow-open{font-size:13px;color:var(--accent);font-weight:600;margin-right:6px;}

  /* Meus Sistemas — tiles tech (legado, mantido) */
  .tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
  .sys-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;
    color:var(--fg);background:linear-gradient(160deg,var(--card),var(--card-2));border:1px solid var(--border);
    border-radius:16px;padding:22px 16px 18px;transition:.16s;overflow:hidden;}
  .sys-tile::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% -20%,rgba(47,129,247,.18),transparent 60%);opacity:0;transition:.16s;}
  .sys-tile:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 16px 40px rgba(0,0,0,.45);}
  .sys-tile:hover::before{opacity:1;}
  .sys-ico{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:20px;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.35);}
  .sys-name{font-weight:600;font-size:14px;text-align:center;z-index:1;}
  .sys-cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;z-index:1;}
  .sys-open{margin-top:4px;font-size:12px;color:var(--accent);font-weight:600;z-index:1;}
  .sys-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:.14s;z-index:2;}
  .sys-tile:hover .sys-actions{opacity:1;}
  .sys-mini{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--bg-2);
    color:var(--fg);cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center;}
  .sys-mini:hover{background:var(--danger);color:#fff;border-color:var(--danger);}

  /* Links de acesso — linhas */
  .link-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;text-decoration:none;
    color:var(--fg);transition:.12s;}
  .link-row:hover{background:var(--card-2);}
  .link-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#fff;font-size:16px;flex:0 0 40px;}
  .link-name{font-weight:600;font-size:14px;}
  .link-url{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .link-open{font-size:12px;color:var(--accent);font-weight:600;margin-right:4px;}
</style>
</head>

   Cada "chave" abaixo vira um documento em users/{uid}/dados/{chave}.
   ============================================================ */
const DB_KEYS = {
  notes:"kh_notes", bibleInbox:"kh_bible_inbox", bibleNotes:"kh_bible_notes",
  bibleHighlights:"kh_bible_hl", savedVerses:"kh_saved_verses",
  quickInbox:"kh_quick_inbox", vault:"kh_vault", books:"kh_books", lectures:"kh_lectures",
  studies:"kh_studies", studyFolders:"kh_study_folders", cards:"kh_cards", decks:"kh_decks",
  goals:"kh_goals", agenda:"kh_agenda", systems:"kh_systems", accessLinks:"kh_links",
  accounts:"kh_accounts", profile:"profile",
};
const DB = {
  // lê uma chave (com valor padrão). FIREBASE (futuro): ler do cache carregado no login.
  load(storeKey, def){
    const lsKey = DB_KEYS[storeKey] || storeKey;
    try{ return JSON.parse(localStorage.getItem(lsKey)) ?? def; }catch{ return def; }
  },
  // salva uma chave. FIREBASE (futuro): gravar no cache + agendar gravação no Firestore (debounce).
  save(storeKey, value){
    const lsKey = DB_KEYS[storeKey] || storeKey;
    try{ localStorage.setItem(lsKey, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  },
};
// compat: mantém load() antigo apontando para a nova camada
function load(k,def){ return DB.load(k,def); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
/* Mostra/esconde senha (olhinho) */
function togglePass(id, el){
  const inp=document.getElementById(id); if(!inp) return;
  const show = inp.type==="password";
  inp.type = show ? "text" : "password";
  if(el) el.textContent = show ? "🙈" : "👁️";
}
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1900); }
async function sha256(s){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

/* Salva TODem uma vez. FIREBASE (futuro): este é o ponto do debounce -> Firestore. */
const PERSIST_KEYS = ["notes","bibleInbox","bibleNotes","bibleHighlights","savedVerses","quickInbox","vault","books","lectures","studies","studyFolders","cards","decks","goals","agenda","systems","accessLinks"];
function persist(){
  let overflow=false;
  PERSIST_KEYS.forEach(k=>{
    const ok=DB.save(k, store[k]);       // salva local (rápido, offline)
    if(!ok && k==="books") overflow=true;

/* Aceita vários formatos comuns de "bíblia em JSON" e normaliza para
   BIBLE = { "Nome do Livro": [ [v1,v2,...], [cap2...], ... ] } */
/* Mapa de abreviações (formato thiagobodruk/biblia) -> nomes completos, na ordem canônica */
const BOOK_ABBR = {
  gn:"Gênesis", ex:"Êxodo", lv:"Levítico", nm:"Números", dt:"Deuteronômio",
  js:"Josué", jz:"Juízes", rt:"Rute", "1sm":"1 Samuel", "2sm":"2 Samuel",
  "1rs":"1 Reis", "2rs":"2 Reis", "1cr":"1 Crônicas", "2cr":"2 Crônicas",
  ed:"Esdras", ne:"Neemias", et:"Ester", jó:"Jó", job:"Jó", sl:"Salmos",
  pv:"Provérbios", ec:"Eclesiastes", ct:"Cânticos", is:"Isaías", jr:"Jeremias",
  lm:"Lamentações", ez:"Ezequiel", dn:"Daniel", os:"Oséias", jl:"Joel",
  am:"Amós", ob:"Obadias", jn:"Jonas", mq:"Miquéias", na:"Naum", hc:"Habacuque",
  sf:"Sofonias", ag:"Ageu", zc:"Zacarias", ml:"Malaquias",
  mt:"Mateus", mc:"Marcos", lc:"Lucas", jo:"João", at:"Atos", rm:"Romanos",
  "1co":"1 Coríntios", "2co":"2 Coríntios", gl:"Gálatas", ef:"Efésios",
  fp:"Filipenses", cl:"Colossenses", "1ts":"1 Tessalonicenses", "2ts":"2 Tessalonicenses",
  "1tm":"1 Timóteo", "2tm":"2 Timóteo", tt:"Tito", fm:"Filemom", hb:"Hebreus",
  tg:"Tiago", "1pe":"1 Pedro", "2pe":"2 Pedro", "1jo":"1 João", "2jo":"2 João",
  "3jo":"3 João", jd:"Judas", ap:"Apocalipse"
};
function nomeLivro(l){
  const raw=(l.name||l.nome||l.abbrev||"").toString();
  const key=raw.toLowerCase().trim();
  return BOOK_ABBR[key] || (l.name||l.nome) || raw.charAt(0).toUpperCase()+raw.slice(1);
}
function normalizarBiblia(data){
  const out={};
  try{
    // Formato A: array [{name/nome/abbrev, chapters:[[...],[...]]}]  (thiagobodruk usa abbrev)
    if(Array.isArray(data) && data[0] && (data[0].chapters||data[0].capitulos) &&
       Array.isArray((data[0].chapters||data[0].capitulos)[0])){
      data.forEach(l=>{ out[nomeLivro(l)] = (l.chapters||l.capitulos); });
      return out;
    }
    // Formato B: array [{..., chapters:[{verses:[{text}]}]}] (verses como objetos)
    if(Array.isArray(data) && data[0] && data[0].chapters && data[0].chapters[0] && data[0].chapters[0].verses){
      data.forEach(l=>{ out[nomeLivro(l)] = l.chapters.map(c=>c.verses.map(v=>v.text||v.texto||v)); });
      return out;
    }
    // Formato C: objeto { "Gênesis": [ [..], [..] ] } (já pronto)
    if(!Array.isArray(data) && typeof data==="object"){
      const k=Object.keys(data)[0];
      if(Array.isArray(data[k])){ return data; }
    }
    // Formato D: objeto { "Gênesis": { "1": {"1":"texto",...} } }
    if(!Array.isArray(data) && typeof data==="object"){
      Object.keys(data).forEach(livro=>{
        const caps=data[livro];
        out[livro]=Object.keys(caps).sort((a,b)=>+a-+b).map(cn=>{
          const vs=caps[cn]; return Array.isArray(vs)?vs:Object.keys(vs).sort((a,b)=>+a-+b).map(vn=>vs[vn]);
        });
      });
      return out;
    }
  }catch(e){ console.error("Formato de bíblia não reconhecido:",e); }
  return null;
}
async function carregarBibliaCompleta(){
  try{
    const resp=await fetch("biblia.json");
    if(!resp.ok) throw new Error("arquivo não encontrado");
    const data=await resp.json();
    const norm=normalizarBiblia(data);
    if(norm && Object.keys(norm).length>3){
      BIBLE=norm; BIBLE_COMPLETA=true;
      if(!BIBLE[store.bible.book]) store.bible.book=Object.keys(BIBLE)[0];
      if(store.view==="bible") render();
      toast(`Bíblia completa carregada: ${Object.keys(BIBLE).length} livros.`);
    }
  }catch(e){
    // Sem arquivo: segue com a amostra. (Silencioso — o banner na tela avisa.)
    console.log("biblia.json não carregada:", e.message);
  }
}

/* ======================= AUTH =======================
   Hoje: contas locais (localStorage, senha em hash SHA-256).
   FIREBASE (futuro): trocar accounts()/submitLogin() por
   signInWithEmailAndPassword + perfil em users/{uid} (role, nome, ativo).
   Manter um fallback local (admin) caso o Firebase caia. */
function accounts(){ return DB.load("accounts",[]); }
function saveAccounts(a){ DB.save("accounts",a); }

function renderLoginChips(){
  const chips = document.getElementById("acctChips");
  const list = accounts();
  chips.innerHTML = (store.loginMode==="login" && list.length)
    ? list.map(a=>`<button class="btn btn-sm" onclick="document.getElementById('loginUser').value='${escapeHtml(a.name)}'">${escapeHtml(a.name)}</button>`).join("")
    : "";
  if(list.length===0) store.loginMode="register";
  document.getElementById("loginSubmit").textContent = store.loginMode==="login"?"Entrar":"Criar conta";
  document.getElementById("loginToggle").textContent = store.loginMode==="login"?"Cadastrar outra conta":"Já tenho conta";
}
async function submitLogin(){
  const email=document.getElementById("loginUser").value.trim().toLowerCase();
  const pass=document.getElementById("loginPass").value;
  const nameField=document.getElementById("loginName");
  const err=document.getElementById("loginErr"); err.textContent="";
  const msg=document.getElementById("loginMsg"); if(msg) msg.textContent="";
  if(!email||!pass){ err.textContent="Preencha e-mail e senha."; return; }

  // lembrar e-mail (salvo localmente neste aparelho)
  const remember=document.getElementById("rememberEmail")?.checked;
  try{
    if(remember) localStorage.setItem("kh_remember_email", email);
    else localStorage.removeItem("kh_remember_email");
  }catch(e){}

  // ---- MODO NUVEM (Firebase) ----
  if(FB_OK){
    try{
      if(store.loginMode==="register"){
        const nome=(nameField?.value||"").trim() || email.split("@")[0];
        const cred=await fbAuth.createUserWithEmailAndPassword(email,pass);
        const uid=cred.user.uid;
        // primeiro usuário do sistema vira admin
        const snap=await fbDB.collection("users").get();
        const isAdmin = snap.empty; // se não há ninguém ainda
        await fbDB.collection("users").doc(uid).set({ nome, email, role:isAdmin?"admin":"cliente", ativo:true, criadoEm:Date.now() });
        await carregarPerfilESessao(uid, {nome,email,isAdmin});
      } else {
        const cred=await fbAuth.signInWithEmailAndPassword(email,pass);
        await carregarPerfilESessao(cred.user.uid);
      }
      return;
    }catch(e){
      err.textContent = traduzErroFirebase(e); return;
    }
  }

  // ---- FALLBACK LOCAL (Firebase indisponível) ----
  let list=accounts();
  const hash=await sha256(pass);
  if(store.loginMode==="register"){
    if(list.find(a=>a.email===email||a.name===email)){ err.textContent="Conta já existe."; return; }
    const nome=(nameField?.value||"").trim() || email.split("@")[0];
    const acc={id:uid(),name:nome,email,hash,avatar:"",course:"",isAdmin:list.length===0};
    list.push(acc); saveAccounts(list); store.user=acc;
  } else {
    const acc=list.find(a=>a.email===email||a.name===email);
    if(!acc){ err.textContent="Conta não encontrada."; return; }
    if(acc.hash!==hash){ err.textContent="Senha incorreta."; return; }
    store.user=acc;
  }
  enterApp();
}
/* Carrega o perfil do Firestore e entra no app. Se dados vierem, usa; senão usa o passado. */
async function carregarPerfilESessao(uid, fallbackProfile){
  let prof=fallbackProfile||{};
  try{
    const doc=await fbDB.collection("users").doc(uid).get();
    if(doc.exists){ const d=doc.data();
      if(d.ativo===false){ document.getElementById("loginErr").textContent="Esta conta está desativada."; await fbAuth.signOut(); return; }
      prof={ nome:d.nome, email:d.email, isAdmin:d.role==="admin",
             school:d.school||"", course:d.course||"", period:d.period||"", bio:d.bio||"", avatar:d.avatar||"" };
    }
  }catch(e){ console.warn("Perfil não carregado:",e.message); }
  store.user={ id:uid, uid, name:prof.nome||"", email:prof.email||"", isAdmin:!!prof.isAdmin,
    avatar:prof.avatar||"", school:prof.school||"", course:prof.course||"", period:prof.period||"", bio:prof.bio||"" };
  await carregarDadosNuvem(uid);
  enterApp();
}
function traduzErroFirebase(e){
  const c=(e&&e.code)||"";
  if(c.includes("email-already-in-use")) return "Este e-mail já tem conta. Faça login.";
  if(c.includes("invalid-email")) return "E-mail inválido.";
  if(c.includes("weak-password")) return "Senha fraca (mínimo 6 caracteres).";
  if(c.includes("user-not-found")) return "Conta não encontrada.";
  if(c.includes("wrong-password")||c.includes("invalid-credential")) return "E-mail ou senha incorretos.";
  if(c.includes("too-many-requests")) return "Muitas tentativas. Aguarde um pouco.";
  if(c.includes("network")) return "Sem conexão. Verifique a internet.";
  return "Erro ao entrar: "+(e.message||c);
}
/* Esqueci a senha — envia e-mail de redefinição (Firebase). */
async function forgotPassword(){
  const email=document.getElementById("loginUser").value.trim().toLowerCase();
  const err=document.getElementById("loginErr"); const msg=document.getElementById("loginMsg");
  err.textContent=""; msg.textContent="";
  if(!email){ err.textContent="Digite seu e-mail no campo acima e clique de novo em 'Esqueci a senha'."; return; }
  if(!FB_OK){ err.textContent="Recuperação de senha só funciona com internet/nuvem."; return; }
  try{
    await fbAuth.sendPasswordResetEmail(email);
    msg.textContent="Enviamos um link de redefinição para "+email+". Confira sua caixa de entrada (e o spam).";
  }catch(e){ err.textContent=traduzErroFirebase(e); }
}
/* ===== Dados na nuvem (Firestore) — cache + debounce =====
   Estrutura: users/{uid}/dados/{chave}  (um doc por chave do PERSIST_KEYS) */
let _cloudUid=null, _cloudSaveTimers={};
async function carregarDadosNuvem(uid){
  _cloudUid = FB_OK ? uid : null;
  if(!FB_OK) return;
  try{
    const snap=await fbDB.collection("users").doc(uid).collection("dados").get();
    const got={};
    snap.forEach(d=>{ got[d.id]=d.data().v; });
    // aplica no store o que veio da nuvem; o que não veio, mantém o padrão atual
    PERSIST_KEYS.forEach(k=>{ if(got[k]!==undefined) store[k]=got[k]; });
  }catch(e){ console.warn("Dados da nuvem não carregados:",e.message); toast("Não foi possível carregar seus dados da nuvem."); }
}
/* grava UMA chave na nuvem com debounce (evita gravar a cada tecla) */
function salvarChaveNuvem(k){
  if(!FB_OK || !_cloudUid) return;
  clearTimeout(_cloudSaveTimers[k]);
  _cloudSaveTimers[k]=setTimeout(async()=>{
    try{ await fbDB.collection("users").doc(_cloudUid).collection("dados").doc(k).set({ v: store[k] }); }
    catch(e){ console.warn("Falha ao salvar",k,e.message); }
  }, 800);
}

  const now=Date.now();
  return store.cards.filter(c=>(deckId?c.deck===deckId:true) && (!c.due || c.due<=now));
}

  const decks=store.decks;
  const totalDue=cardsDue(null).length;

    const total=store.cards.filter(c=>c.deck===d.id).length;

        <button class="btn btn-sm" onclick="viewDeckCards('${d.id}')">Ver todos</button>

  const body = decks.length

/* cálculo do próximo intervalo em dias, dado o grau (0 errei,1 difícil,2 bom,3 fácil) */
function nextInterval(card,grade){
  let ease=card.ease||2.5, interval=card.interval||0, reps=card.reps||0;
  if(grade===0){ reps=0; interval=0; ease=Math.max(1.3,ease-0.2); }
  else{
    if(reps===0) interval=(grade===1?1:grade===2?1:2);
    else if(reps===1) interval=(grade===1?3:grade===2?4:6);
    else interval=Math.round(interval*(grade===1?ease*0.7:grade===2?ease:ease*1.3));
    ease=Math.max(1.3, ease+(grade===1?-0.15:grade===3?0.15:0));
    reps=reps+1;
  }
  return {ease,interval,reps};
}
function intervalLabel(card,grade){
  const {interval}=nextInterval(card,grade);
  if(interval<1) return "hoje";
  if(interval===1) return "1 dia";
  if(interval<30) return interval+" dias";
  const m=Math.round(interval/30); return m+(m===1?" mês":" meses");
}
function gradeCard(grade){
  const q=store.reviewQueue, c=store.cards.find(x=>x.id===q[store.reviewIdx]); if(!c) return;
  const nx=nextInterval(c,grade);
  c.ease=nx.ease; c.interval=nx.interval; c.reps=nx.reps;
  c.due = Date.now() + (nx.interval<1 ? 60*1000 : nx.interval*24*60*60*1000); // errei = volta em 1 min
  c.lastReview=Date.now();
  // se errou, recoloca no fim da fila desta sessão
  if(grade===0) q.push(c.id);
  store.reviewIdx++; persist(); render();
}

function todayKey(d){ d=d||new Date(); return d.toISOString().slice(0,10); }
function registrarEstudo(min){
  const g=store.goals; const k=todayKey();
  g.focusLog[k]=(g.focusLog[k]||0)+min;
  // atualiza streak
  const ontem=todayKey(new Date(Date.now()-864e5));
  if(g.lastStudyDay!==k){
    if(g.lastStudyDay===ontem) g.streak=(g.streak||0)+1;
    else g.streak=1;
    g.lastStudyDay=k;
  }
  persist();
}

        </div>

const AG_TYPES={prova:{i:"📝",c:"#a03535",n:"Prova"},entrega:{i:"📤",c:"#c2410c",n:"Entrega"},aula:{i:"🎓",c:"#2f6fb0",n:"Aula"},palestra:{i:"🎤",c:"#8257b5",n:"Palestra"},outro:{i:"📌",c:"#59636e",n:"Outro"}};
function viewAgenda(){
  const now=new Date();
  const cur = store.agendaMonth || {y:now.getFullYear(), m:now.getMonth()};
  const y=cur.y, m=cur.m;
  const first=new Date(y,m,1);
  const startDow=first.getDay(); // 0=domingo
  const daysInMonth=new Date(y,m+1,0).getDate();
  const todayStr=todayKey();
  const monthName=first.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});

  // eventos por dia (YYYY-MM-DD)
  const byDay={};
  store.agenda.forEach(e=>{ (byDay[e.date]=byDay[e.date]||[]).push(e); });

  // monta as células (6 semanas x 7 = 42 para grade uniforme)
  let cells="";
  for(let i=0;i<42;i++){
    const dayNum=i-startDow+1;
    if(dayNum<1 || dayNum>daysInMonth){ cells+=`<div class="cal-cell cal-empty"></div>`; continue; }
    const dateStr=`${y}-${String(m+1).padStart(2,"0")}-${String(dayNum).padStart(2,"0")}`;
    const evs=(byDay[dateStr]||[]).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    const isToday=dateStr===todayStr;
    const evHtml=evs.slice(0,3).map(e=>{
      const T=AG_TYPES[e.type]||AG_TYPES.outro;
      return `<div class="cal-ev" style="background:${T.c}" onclick="event.stopPropagation();editAgenda('${e.id}')" title="${escapeHtml(e.title)}${e.time?' · '+e.time:''}">${T.i} ${escapeHtml(e.title)}</div>`;
    }).join("");
    const more=evs.length>3?`<div class="cal-more">+${evs.length-3} mais</div>`:"";
    cells+=`<div class="cal-cell ${isToday?"cal-today":""}" onclick="newAgendaOn('${dateStr}')">
      <div class="cal-daynum">${dayNum}</div>${evHtml}${more}</div>`;
  }

  const dows=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d=>`<div class="cal-dow">${d}</div>`).join("");

  // lista dos próximos (lateral rápida)
  const prox=store.agenda.filter(e=>e.date>=todayStr).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);
  const proxHtml=prox.length?prox.map(e=>{
    const T=AG_TYPES[e.type]||AG_TYPES.outro; const d=new Date(e.date+"T00:00:00");
    return `<div class="ag-item" onclick="editAgenda('${e.id}')" style="cursor:pointer">
      <div class="ag-date" style="background:${T.c}"><div class="ag-day">${d.getDate()}</div><div class="ag-mon">${d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")}</div></div>
      <div style="flex:1;min-width:0"><div class="ag-title">${T.i} ${escapeHtml(e.title)}${e.date===todayStr?' <span class="ag-today">hoje</span>':""}</div>
      <div class="sub">${d.toLocaleDateString("pt-BR",{weekday:"long"})}${e.time?" · "+e.time:""}</div></div>
    </div>`;
  }).join(""):`<div class="sub" style="padding:8px">Nenhum compromisso futuro.</div>`;

  return `<div class="grid">
    <div class="row" style="align-items:center">
      <div class="page-head"><div class="ph-ico" style="background:linear-gradient(135deg,#2f6fb0,#7cc4ff)">📅</div>
        <div><h1>Agenda</h1><div class="sub">Clique num dia para adicionar</div></div></div>
      <div class="spacer"></div>
      <button class="btn btn-accent" onclick="newAgenda()">+ Novo compromisso</button>
    </div>

    <div class="cal-toolbar">
      <button class="btn btn-sm" onclick="agendaNav(-1)">‹</button>
      <div class="cal-month">${monthName.charAt(0).toUpperCase()+monthName.slice(1)}</div>
      <button class="btn btn-sm" onclick="agendaNav(1)">›</button>
      <button class="btn btn-sm" onclick="agendaHoje()">Hoje</button>
      <div class="spacer"></div>
      <div class="cal-legend">${Object.values(AG_TYPES).map(t=>`<span><i style="background:${t.c}"></i>${t.n}</span>`).join("")}</div>
    </div>

    <div class="cal-grid">${dows}${cells}</div>

    <div class="card" style="margin-top:8px">
      <div class="label-sm">Próximos compromissos</div>
      <div class="ag-list">${proxHtml}</div>
    </div>
  </div>`;
}

function exportarBackup(){
  const dump={ _app:"KnowledgeHub", _versao:1, _data:new Date().toISOString(),
    notes:store.notes, bibleInbox:store.bibleInbox, bibleNotes:store.bibleNotes,
    bibleHighlights:store.bibleHighlights, savedVerses:store.savedVerses, quickInbox:store.quickInbox,
    vault:store.vault, books:store.books, lectures:store.lectures, studies:store.studies, studyFolders:store.studyFolders,
    cards:store.cards, decks:store.decks, goals:store.goals, agenda:store.agenda, systems:store.systems, accessLinks:store.accessLinks };
  const blob=new Blob([JSON.stringify(dump,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="knowledge-hub-backup-"+todayKey()+".json"; a.click();
  toast("Backup exportado. Guarde o arquivo em local seguro.");
}
function importarBackup(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let d; try{ d=JSON.parse(r.result); }catch{ toast("Arquivo inválido."); return; }
    if(d._app!=="KnowledgeHub"){ toast("Este arquivo não é um backup do Knowledge Hub."); return; }
    askConfirm("Importar este backup vai SUBSTITUIR todo o conteúdo atual (notas, estudos, cartões, etc.). Deseja continuar?", ()=>{
      ["notes","bibleInbox","bibleNotes","bibleHighlights","savedVerses","quickInbox","vault","books","lectures","studies","studyFolders","cards","decks","goals","agenda","systems"].forEach(k=>{ if(d[k]!==undefined) store[k]=d[k]; });
      if(d.accessLinks!==undefined) store.accessLinks=d.accessLinks;
      persist(); render(); toast("Backup importado com sucesso.");
    }, "Substituir tudo");
  };
  r.readAsText(f);
}

async function saveSettingsProfile(){
  const u=store.user; if(!u){ toast("Sessão não encontrada."); return; }
  // atualiza o objeto do usuário em memória
  u.name=document.getElementById("setName").value.trim()||u.name;
  u.school=document.getElementById("setSchool").value.trim();
  u.course=document.getElementById("setCourse").value.trim();
  u.period=document.getElementById("setPeriod").value.trim();
  u.bio=document.getElementById("setBio").value.trim();
  if(_setAvatar){ u.avatar=_setAvatar; _setAvatar=null; }

  if(FB_OK && u.uid){
    // salva o perfil no Firestore: users/{uid}
    try{
      await fbDB.collection("users").doc(u.uid).set({
        nome:u.name, school:u.school||"", course:u.course||"", period:u.period||"", bio:u.bio||"", avatar:u.avatar||""
      }, {merge:true});
      updateAvatar(); render(); toast("Dados salvos na nuvem ✓");
    }catch(e){ console.warn(e); toast("Erro ao salvar na nuvem: "+(e.message||"")); }
  } else {
    // fallback local
    const list=accounts(); const acc=list.find(a=>a.id===u.id);
    if(acc){ Object.assign(acc,{name:u.name,school:u.school,course:u.course,period:u.period,bio:u.bio,avatar:u.avatar}); saveAccounts(list); }

async function changePassword(){
  const cur=document.getElementById("curPass").value;
  const n1=document.getElementById("newPass").value;
  const n2=document.getElementById("newPass2").value;
  if(!cur||!n1){ toast("Preencha a senha atual e a nova."); return; }
  if(n1!==n2){ toast("A confirmação não bate com a nova senha."); return; }

  if(FB_OK && fbAuth.currentUser){
    if(n1.length<6){ toast("A nova senha precisa ter ao menos 6 caracteres."); return; }
    try{
      // Firebase exige reautenticar antes de trocar a senha
      const cred=firebase.auth.EmailAuthProvider.credential(fbAuth.currentUser.email, cur);
      await fbAuth.currentUser.reauthenticateWithCredential(cred);
      await fbAuth.currentUser.updatePassword(n1);
      document.getElementById("curPass").value=document.getElementById("newPass").value=document.getElementById("newPass2").value="";
      toast("Senha alterada com sucesso ✓");
    }catch(e){
      if((e.code||"").includes("wrong-password")||(e.code||"").includes("invalid-credential")) toast("Senha atual incorreta.");
      else toast("Erro: "+traduzErroFirebase(e));
    }
    return;
  }
  // fallback local
  if(n1.length<4){ toast("Use uma senha com pelo menos 4 caracteres."); return; }
  const list=accounts(); const acc=list.find(a=>a.id===store.user.id);
  const curHash=await sha256(cur);
  if(!acc || acc.hash!==curHash){ toast("Senha atual incorreta."); return; }
  acc.hash=await sha256(n1); saveAccounts(list); store.user=acc;
  document.getElementById("curPass").value=document.getElementById("newPass").value=document.getElementById("newPass2").value="";
  toast("Senha alterada com sucesso.");
}

/* Instância secundária: cria o usuário SEM deslogar o admin (item 3.6 do Guia). */
let _fbSecondary=null;
function getSecondaryAuth(){
  if(!_fbSecondary){ _fbSecondary = firebase.initializeApp(firebaseConfig, "secondary"); }
  return _fbSecondary.auth();
}
async function createUserFirebase(){
  if(!store.user?.isAdmin){ toast("Apenas administradores podem criar contas."); return; }
  if(!FB_OK){ toast("Criar usuários exige conexão com a nuvem."); return; }
  const nome=document.getElementById("newAcctName").value.trim();
  const email=document.getElementById("newAcctEmail").value.trim().toLowerCase();
  const pass=document.getElementById("newAcctPass").value;
  const admin=document.getElementById("newAcctAdmin").checked;
  if(!nome||!email||!pass){ toast("Preencha nome, e-mail e senha."); return; }
  if(pass.length<6){ toast("A senha precisa ter ao menos 6 caracteres."); return; }
  try{
    const secAuth=getSecondaryAuth();
    const cred=await secAuth.createUserWithEmailAndPassword(email,pass);
    const newUid=cred.user.uid;
    // cria o perfil no Firestore (feito pelo admin logado na instância principal)
    await fbDB.collection("users").doc(newUid).set({
      nome, email, role:admin?"admin":"cliente", ativo:true, criadoEm:Date.now()
    });
    await secAuth.signOut(); // encerra a sessão secundária, admin permanece logado
    document.getElementById("newAcctName").value="";
    document.getElementById("newAcctEmail").value="";
    document.getElementById("newAcctPass").value="";
    document.getElementById("newAcctAdmin").checked=false;
    toast("Acesso criado para "+nome+" ✓");
    carregarUsuarios();
  }catch(e){ toast("Erro ao criar: "+traduzErroFirebase(e)); }
}
async function carregarUsuarios(){
  const box=document.getElementById("userList"); if(!box) return;
  if(!FB_OK){ box.innerHTML='<div class="sub" style="padding:8px">Sem conexão com a nuvem.</div>'; return; }
  try{
    const snap=await fbDB.collection("users").get();
    const rows=[];
    snap.forEach(d=>{ const u=d.data(); rows.push({uid:d.id,...u}); });
    if(!rows.length){ box.innerHTML='<div class="sub" style="padding:8px">Nenhum usuário ainda.</div>'; return; }
    box.innerHTML=rows.map(a=>{
      const eu=a.uid===store.user.uid;
      const inativo=a.ativo===false;
      return `<div class="set-acct">
        <div class="avatar" style="width:38px;height:38px;font-size:15px">${escapeHtml((a.nome||a.email||"?").slice(0,1).toUpperCase())}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600">${escapeHtml(a.nome||"(sem nome)")} ${eu?'<span class="sub">(você)</span>':""} ${inativo?'<span class="sub" style="color:var(--danger)">• desativado</span>':""}</div>
          <div class="sub">${escapeHtml(a.email||"")} · ${a.role==="admin"?"Administrador":"Membro"}</div>
        </div>
        ${!eu?`<button class="btn btn-sm ${inativo?"btn-accent":"btn-danger"}" onclick="toggleUserActive('${a.uid}',${inativo})">${inativo?"Reativar":"Desativar"}</button>`:""}
      </div>`;
    }).join("");
  }catch(e){ box.innerHTML='<div class="sub" style="padding:8px">Erro ao carregar: '+escapeHtml(e.message||"")+'</div>'; }
}
async function toggleUserActive(uid,ativar){
  if(!store.user?.isAdmin) return;
  askConfirm(ativar?"Reativar este acesso?":"Desativar este acesso? A pessoa não conseguirá mais entrar.", async()=>{
    try{ await fbDB.collection("users").doc(uid).set({ativo:!!ativar},{merge:true}); toast(ativar?"Acesso reativado.":"Acesso desativado."); carregarUsuarios(); }
    catch(e){ toast("Erro: "+(e.message||"")); }
  }, ativar?"Reativar":"Desativar");
}

let _confirmAction=null;

  _confirmAction=onYes;
  document.getElementById("modalBox").innerHTML=`
    <h2 style="margin-bottom:8px">Confirmar</h2>

function _runConfirm(){ const a=_confirmAction; _confirmAction=null; closeModal(); if(typeof a==="function") a(); }

/* Entrada de texto própria (substitui o prompt() do navegador).
   Pode pedir 1 ou vários campos. onOk recebe: string (1 campo) ou objeto (vários). */
let _inputAction=null;
function askInput(opts){
  // opts: {title, fields:[{key,label,value,ph,type}], okLabel, onOk}  OU  {title,label,value,ph,onOk} p/ 1 campo
  const fields = opts.fields || [{key:"v",label:opts.label||"",value:opts.value||"",ph:opts.ph||"",type:opts.type||"text"}];
  _inputAction = opts.onOk;
  document.getElementById("modalBox").innerHTML=`
    <h2 style="margin-bottom:12px">${escapeHtml(opts.title||"")}</h2>
    ${fields.map((f,i)=>`
      ${f.label?`<div class="label-sm">${escapeHtml(f.label)}</div>`:""}
      <input class="field" id="_inp_${i}" type="${f.type||"text"}" value="${escapeHtml(f.value||"")}" placeholder="${escapeHtml(f.ph||"")}"
        ${i===0?"onkeydown=\"if(event.key==='Enter'){event.preventDefault();_runInput();}\"":""}>
    `).join("")}
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" onclick="_runInput()">${escapeHtml(opts.okLabel||"Salvar")}</button>
    </div>`;
  window._inputFields = fields;
  document.getElementById("modalOverlay").classList.add("show");
  setTimeout(()=>document.getElementById("_inp_0")?.focus(),40);
}
function _runInput(){
  const fields=window._inputFields||[]; const out={};
  fields.forEach((f,i)=>{ out[f.key]=(document.getElementById("_inp_"+i)?.value||"").trim(); });
  const a=_inputAction; _inputAction=null; closeModal();
  if(typeof a==="function") a(fields.length===1 ? out[fields[0].key] : out);
}

function setPomoFocus(min){ _pomoFocusMin=min; if(!_pomoRunning && _pomoPhase==="focus"){ _pomoSecs=min*60; } render(); }
function setPomoBreak(min){ _pomoBreakMin=min; if(!_pomoRunning && _pomoPhase==="break"){ _pomoSecs=min*60; } render(); }
function pomoToggle(){
  _pomoRunning=!_pomoRunning;
  const b=document.getElementById("pomoToggle"); if(b) b.textContent=_pomoRunning?"Pausar":"Iniciar";
  if(_pomoRunning){
    _pomoTimer=setInterval(()=>{
      _pomoSecs--;
      if(_pomoSecs<=0){
        clearInterval(_pomoTimer); _pomoRunning=false;
        if(_pomoPhase==="focus"){
          logPomo(); toast("Foco concluído! Hora do intervalo ☕");
          _pomoPhase="break"; _pomoSecs=_pomoBreakMin*60;
        } else {
          toast("Intervalo terminado! De volta ao foco 🎯");
          _pomoPhase="focus"; _pomoSecs=_pomoFocusMin*60;
        }
        render();
      }
      updatePomoDisp();
    },1000);
  } else clearInterval(_pomoTimer);
}
function pomoReset(){ clearInterval(_pomoTimer); _pomoRunning=false; _pomoPhase="focus"; _pomoSecs=_pomoFocusMin*60; updatePomoDisp();
  const b=document.getElementById("pomoToggle"); if(b) b.textContent="Iniciar"; }
function logPomo(){
  if(!store.activeNote) return;
  const n=store.notes.find(x=>x.id===store.activeNote); if(!n) return;
  const stamp=`\n> ⏱️ Sessão de foco (${_pomoFocusMin}min) concluída — ${new Date().toLocaleString("pt-BR")}`;
  if(n.html!==undefined){ n.html=(n.html||"")+`<p>${stamp.replace(/^\n> /,"")}</p>`; }
  else { n.content=(n.content||"")+stamp; }
  persist();
}

function salvarVersiculo(book,chap,vi){
  const text=BIBLE[book][chap][vi], ref=`${book} ${chap+1}:${vi+1}`;
  const full=`"${text}" (${ref})`;
  // copia pra área de transferência
  try{ navigator.clipboard.writeText(full); }catch(e){}
  // evita duplicar
  if(store.savedVerses.some(x=>x.ref===ref)){ toast("Versículo já estava salvo (copiado de novo)."); return; }
  store.savedVerses.unshift({ id:uid(), ref, text, at:Date.now() });
  persist(); render(); toast("Versículo copiado e salvo ✓");
}

function renderReader(book){
  const fs=book.fontSize||20; let body;
  if(book.fmt==="pdf") body=`<div class="empty">PDF: ${escapeHtml(book.title)}.<br><br>
    <button class="btn btn-accent" onclick="openExternal('${book.id}')">Abrir em nova aba</button></div>`;
  else{ const paras=(book.content||"").split(/\n\s*\n/).map(p=>`<p>${escapeHtml(p.trim())}</p>`).join("");
    body=`<div class="reader-scroll"><div class="reader-page" style="font-size:${fs}px" onmouseup="captureSel()">
      <h1>${escapeHtml(book.title)}</h1>${paras||"<p><em>Vazio.</em></p>"}</div></div>`; }
  const header=itemHeader({title:escapeHtml(book.title),onBack:`closeBook()`,onEdit:`editBook('${book.id}')`,onDelete:`deleteBook('${book.id}')`});
  const ctrl=book.fmt==="pdf"?"":`<div class="reader-controls">Fonte
    <button class="btn btn-sm" onclick="bookFont('${book.id}',-1)">A−</button>
    <button class="btn btn-sm" onclick="bookFont('${book.id}',1)">A+</button>
    <div class="spacer"></div><span id="selNote" style="font-size:12px;color:var(--muted)">Selecione um trecho para compartilhar.</span>
    <button class="btn btn-sm" onclick="shareBook('${book.id}')">Compartilhar</button>
    <button class="btn btn-sm" onclick="exportBook('${book.id}')">Exportar</button></div>`;
  return `<div class="panel" id="p-main" style="${panelFlex('main')}">${panelHead("main","Leitor de E-books")}
    <div class="panel-body" style="display:flex;flex-direction:column;padding:0">${header}
    <div style="flex:1;overflow:hidden">${body}</div>${ctrl}</div></div>`;
}
function setupDropZone(){ const dz=document.getElementById("dropZone"); if(!dz)return;
  ["dragover","dragenter"].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add("drag");}));
  ["dragleave","drop"].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove("drag");}));
  dz.addEventListener("drop",ev=>handleFiles(ev.dataTransfer.files)); }
function handleUpload(e){ handleFiles(e.target.files); }
function handleFiles(fl){ [...fl].forEach(file=>{
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  const fmt=["txt","md","epub","pdf"].includes(ext)?(ext==="txt"?"txt":ext):"txt";
  const title=file.name.replace(/\.[^.]+$/,""); const r=new FileReader();
  if(fmt==="txt"||fmt==="md"){ r.onload=()=>addBook({title,fmt,content:r.result}); r.readAsText(file); }
  else if(fmt==="epub"){ r.onload=()=>addBook({title,fmt:"epub",content:extractEpub(r.result)||"(EPUB complexo — leitura completa na versão desktop.)"}); r.readAsText(file); }
  else{ r.onload=()=>addBook({title,fmt:"pdf",dataUrl:r.result}); r.readAsDataURL(file); }
}); }
function extractEpub(raw){ const m=raw.match(/<p[^>]*>([\s\S]*?)<\/p>/gi); if(!m)return"";
  return m.map(x=>x.replace(/<[^>]+>/g,"").trim()).filter(Boolean).join("\n\n"); }

  persist(); render(); toast(`"${title}" adicionado.`); }

function bookFont(id,d){ const b=store.books.find(x=>x.id===id); b.fontSize=Math.max(14,Math.min(30,(b.fontSize||20)+d*2)); persist(); render(); }
function editBook(id){ const b=store.books.find(x=>x.id===id); if(!b)return;

function openExternal(id){ const b=store.books.find(x=>x.id===id); if(!b?.dataUrl)return;

  return nav+main;
}

function closeLecture(){ store.activeLecture=null; render(); }

function deleteLecture(id){ askConfirm("Deletar esta palestra?", ()=>{ store.lectures=store.lectures.filter(x=>x.id!==id); store.activeLecture=null; persist(); render(); }); }
function saveScript(id,v){ const l=store.lectures.find(x=>x.id===id); l.script=v; persist();

function toggleCheck(id,i){ const l=store.lectures.find(x=>x.id===id); const c=l.checklist||defaultChecklist(); c[i].done=!c[i].done; l.checklist=c; persist(); }
let _stageTimer=null,_stageRunning=false,_stageSecs=1200,_stageId=null;
function stageSet(id,min){ const l=store.lectures.find(x=>x.id===id); l.stageSecs=+min*60; _stageSecs=l.stageSecs; persist();
  const d=document.getElementById("stageDisp"); if(d)d.textContent=fmtSecs(_stageSecs); }
function stageReset(id){ const l=store.lectures.find(x=>x.id===id); clearInterval(_stageTimer); _stageRunning=false; _stageSecs=l.stageSecs||1200;
  const d=document.getElementById("stageDisp"); if(d){d.textContent=fmtSecs(_stageSecs);d.classList.remove("danger");} }
function stageToggle(){ _stageRunning=!_stageRunning;
  if(_stageRunning){ _stageTimer=setInterval(()=>{ _stageSecs=Math.max(0,_stageSecs-1);
    const d=document.getElementById("stageDisp"); if(d){ d.textContent=fmtSecs(_stageSecs); d.classList.toggle("danger",_stageSecs<60); }

  else clearInterval(_stageTimer); }
let promptSpeed=1,_promptTimer=null,_promptOn=false;

function editSystemModal(sys){

    <div class="row" id="sysColors" style="margin-bottom:8px">
      ${TILE_COLORS.map(c=>`<div onclick="pickSysColor(this.dataset.c)" data-c="${c}"
        style="width:34px;height:34px;border-radius:10px;background:${c};cursor:pointer;border:2px solid ${s.color===c?'#fff':'transparent'}"></div>`).join("")}

let _sysColor="", _sysLogo="";
function pickSysColor(c){ _sysColor=c;
  document.querySelectorAll("#sysColors [data-c]").forEach(el=>el.style.border="2px solid "+(el.dataset.c===c?"#fff":"transparent"));
  if(!_sysLogo){ const p=document.getElementById("sysLogoPrev"); if(p) p.style.background=c; }
}
function pickSysLogo(e){ const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ _sysLogo=r.result;
    const p=document.getElementById("sysLogoPrev"); if(p){ p.style.background="#fff"; p.style.padding="4px";
      p.innerHTML=`<img src="${r.result}" style="width:100%;height:100%;object-fit:contain;border-radius:8px">`; }
  }; r.readAsDataURL(f);
}
function clearSysLogo(){ _sysLogo=""; const p=document.getElementById("sysLogoPrev");
  if(p){ p.style.background=_sysColor; p.style.padding=""; p.textContent=tileInitials(document.getElementById("sysName")?.value||"?"); } }
function saveSystem(id){
  const name=document.getElementById("sysName").value.trim();
  if(!name){ toast("Dê um nome ao sistema."); return; }
  let url=document.getElementById("sysUrl").value.trim();
  if(url && !/^https?:\/\//i.test(url)) url="https://"+url;
  const data={ name, category:document.getElementById("sysCat").value.trim(), url, color:_sysColor, logo:_sysLogo };
  if(id){ const s=store.systems.find(x=>x.id===id); Object.assign(s,data); }
  else { store.systems.unshift({ id:uid(), ...data }); }
  persist(); closeModal(); render(); toast("Sistema salvo.");
}
function deleteSystem(id){ askConfirm("Remover este sistema?", ()=>{
  store.systems=store.systems.filter(x=>x.id!==id); persist(); render(); }); }

      {k:"place",label:"Local",ph:"Cidade / auditório / online"},
    ]},

    fields:[

    ]},
